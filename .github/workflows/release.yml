name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            binary: claude-bridge-arm64
          - runner: macos-13
            arch: amd64
            binary: claude-bridge-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Building version $VERSION for ${{ matrix.arch }}"
          go build -ldflags "-X main.version=$VERSION" -o ${{ matrix.binary }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          make_latest: true
          body: "Auto-released from commit ${{ github.sha }}"
          files: |
            claude-bridge-arm64
            claude-bridge-amd64
